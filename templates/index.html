<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Emotion Detector</title>
<style>
body{font:18px system-ui;background:#eef2f8;color:#17243a;margin:0;padding:8vh 20px}
main{max-width:760px;margin:auto;background:white;padding:40px;border-radius:18px}
h1{margin-top:0}label{display:block;font-weight:600;margin-bottom:12px}
textarea{box-sizing:border-box;width:100%;font:inherit;padding:14px;border:1px solid #8191ab;border-radius:8px}
button{background:#254ad4;color:white;border:0;padding:13px 24px;font:inherit;border-radius:8px;margin:20px 0;cursor:pointer}
#system_response{line-height:1.7}small{color:#54647b}
</style></head><body><main><small>WATSON NLP</small><h1>Emotion Detector</h1>
<form id="emotion-form"><label for="textToAnalyze">Enter text to analyze</label>
<textarea id="textToAnalyze" rows="4" placeholder="How are you feeling?"></textarea>
<button type="submit">Analyze emotions</button></form>
<div id="system_response" role="status" aria-live="polite"></div>
</main><script src="{{ url_for('static', filename='mywebscript.js') }}"></script></body></html>
